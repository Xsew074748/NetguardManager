services:
  manager:
    build: .
    container_name: netguard-manager
    restart: always
    ports:
      # bind เฉพาะ loopback — การเข้าผ่าน Tailscale ทำด้วย `tailscale serve --bg --tcp 8080 tcp://127.0.0.1:8080`
      # (config เก็บใน tailscaled ไม่ผูกลำดับ start กับ Docker)
      # ห้ามเปลี่ยนเป็น bind IP ของ Tailscale ตรงๆ: ถ้า Docker start ก่อน Tailscale ขึ้น binding จะหายเงียบๆ และไม่กลับมาเอง
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      - BOTS_ROOT=/bots
      - BOTS_HOST_PATH=${BOTS_HOST_PATH}
      - BOT_NETWORK=${BOT_NETWORK}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BOTS_HOST_PATH}:/bots
      - manager-data:/app/data
    networks:
      - manager-net

networks:
  manager-net:
    name: netguard-net
    driver: bridge

volumes:
  # เก็บ stats.db (SQLite) — ใช้ named volume แทน bind mount แบบ BOTS_HOST_PATH เพราะ:
  # 1) เป็นไฟล์ binary ของ manager เอง ไม่ต้องให้คนแก้ไข/อ่านจาก host โดยตรงเหมือนไฟล์ .env ของแต่ละ bot
  # 2) เลี่ยงปัญหา host path บน Windows ที่เคยเจอมาแล้ว (ดู CLAUDE.md บทเรียน)
  # 3) ไม่ต้องเพิ่ม env var ใหม่ (ไม่ต้องมี MANAGER_DATA_HOST_PATH) — Docker จัดการ lifecycle ให้เอง
  manager-data:
